# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nova-dominators
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
